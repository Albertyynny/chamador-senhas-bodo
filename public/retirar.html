<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c78c8"><title>Retirar Senha | Centro de Saúde de Bodó/RN</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="topbar no-print"><div class="brand"><div class="logo">CS</div><div><h1>Retirar senha</h1><p>Centro de Saúde de Bodó/RN</p></div></div><a href="index.html" class="btn btn-secondary">Início</a></header>
<section id="chooser" class="card no-print"><h2 class="section-title">Como podemos atender você?</h2><div class="field patient-field"><label for="patientName">Nome da pessoa (opcional)</label><input id="patientName" maxlength="80" autocomplete="name" placeholder="Digite o nome, se desejar"><div class="small muted">Se ficar vazio, a chamada será feita somente pelo número da senha.</div></div><div class="service-list" id="services"></div></section>
<section id="result" hidden><div class="ticket"><div class="small muted">SUA SENHA</div><div class="code" id="tcode"></div><div class="ticket-name" id="tname" hidden></div><div class="service" id="tservice"></div><div class="time" id="ttime"></div><hr style="border:0;border-top:1px dashed #cbdde9;margin:22px 0"><p class="muted">Aguarde a chamada no painel de atendimento.</p><div class="actions no-print" style="justify-content:center;margin-top:18px"><button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir</button><button class="btn btn-secondary" id="again">Nova senha</button></div></div></section><div class="footer no-print">Atendimento por senha • Nome opcional</div></main>
<script type="module">import{getState,postAction,toast}from'./app.js';const services=document.getElementById('services'),patientName=document.getElementById('patientName');async function load(){try{const s=await getState();services.innerHTML=s.services.map(x=>`<button class="service-btn" data-id="${x.id}"><div class="prefix">${x.prefix}</div><h3>${x.name}</h3><div class="muted">${x.waiting} aguardando</div></button>`).join('');services.querySelectorAll('button').forEach(b=>b.onclick=()=>take(b.dataset.id))}catch(e){toast(e.message,true)}}async function take(id){try{services.querySelectorAll('button').forEach(b=>b.disabled=true);const r=await postAction('take',{serviceId:id,patientName:patientName.value});document.getElementById('chooser').hidden=true;document.getElementById('result').hidden=false;document.getElementById('tcode').textContent=r.ticket.code;const nameEl=document.getElementById('tname');nameEl.textContent=r.ticket.patientName||'';nameEl.hidden=!r.ticket.patientName;document.getElementById('tservice').textContent=r.ticket.serviceName;document.getElementById('ttime').textContent='Emitida às '+new Date(r.ticket.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});window.scrollTo({top:0,behavior:'smooth'})}catch(e){toast(e.message,true);services.querySelectorAll('button').forEach(b=>b.disabled=false)}}document.getElementById('again').onclick=()=>{document.getElementById('result').hidden=true;document.getElementById('chooser').hidden=false;patientName.value='';load()};load();</script></body></html>
