<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062b48"><title>Painel de Chamadas | Centro de Saúde de Bodó/RN</title><link rel="stylesheet" href="styles.css"><style>
body{background:linear-gradient(145deg,#061e33,#0b527b);color:white;overflow-x:hidden}.tv{width:min(1500px,calc(100% - 42px));margin:0 auto;padding:28px 0}.tv-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.tv-brand{display:flex;align-items:center;gap:14px}.tv-logo{width:60px;height:60px;border-radius:18px;background:#fff;color:#09699f;display:grid;place-items:center;font-weight:950}.tv-title{font-size:26px;font-weight:900}.clock{font-size:28px;font-weight:900;text-align:right}.date{font-size:13px;color:#cfeafb}.tv-grid{display:grid;grid-template-columns:1.55fr .65fr;gap:22px;margin-top:24px}.now{min-height:520px;border-radius:34px;background:linear-gradient(145deg,#ffffff,#e9f8ff);color:#082a43;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px;box-shadow:0 30px 80px #00132166}.now .label{font-size:20px;font-weight:850;color:#598099;text-transform:uppercase;letter-spacing:.18em}.now .code{font-size:clamp(112px,18vw,250px);font-weight:1000;letter-spacing:-.08em;color:#076ba8;line-height:.8;margin:30px 0}.now .patient{font-size:clamp(28px,4vw,48px);font-weight:950;margin:-10px 0 20px}.now .desk{font-size:clamp(30px,5vw,62px);font-weight:950}.now .service{font-size:20px;color:#5f7b8d;margin-top:10px}.waiting{background:#ffffff13;border:1px solid #ffffff25;border-radius:30px;padding:22px}.waiting h2{margin:0 0 15px}.last{display:grid;gap:10px}.last-item{display:grid;grid-template-columns:1fr 1.35fr;gap:12px;padding:14px 15px;border-radius:16px;background:#ffffff12}.last-item strong{font-size:26px}.last-item span{align-self:center;color:#e4f6ff}.tv-tools{display:flex;gap:9px;justify-content:flex-end}.tv-tools button{background:#ffffff16;color:white;border:1px solid #ffffff2b}.ticker{margin-top:18px;background:#041725aa;border-radius:20px;padding:14px 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}.ticker strong{color:#6ed9db}.tv-empty{font-size:34px;font-weight:900;color:#7895a7}.tv-empty-sub{color:#7794a7;margin-top:10px}@media(max-width:900px){.tv-grid{grid-template-columns:1fr}.now{min-height:430px}.waiting{display:none}.clock{font-size:21px}.tv-title{font-size:18px}}
</style></head><body><main class="tv"><header class="tv-head"><div class="tv-brand"><div class="tv-logo">CS</div><div><div class="tv-title">CENTRO DE SAÚDE DE BODÓ/RN</div><div class="date" id="date"></div></div></div><div><div class="clock" id="clock">--:--</div><div class="tv-tools"><button class="btn" id="sound">🔊 Ativar som</button><button class="btn" id="full">⛶ Tela cheia</button></div></div></header>
<section class="tv-grid"><div class="now" id="now"><div class="tv-empty">Aguardando chamada</div><div class="tv-empty-sub">A próxima senha aparecerá aqui.</div></div><aside class="waiting"><h2>Últimas chamadas</h2><div class="last" id="last"></div></aside></section><div class="ticker" id="ticker"><strong>Fila</strong><span>Carregando...</span></div></main>
<script type="module">
import{getState,formatTime}from'./app.js';let lastId=null;let soundOn=localStorage.getItem('tvSound')==='1';const soundBtn=document.getElementById('sound');function updateSound(){soundBtn.textContent=soundOn?'🔊 Som ativado':'🔇 Ativar som'}updateSound();soundBtn.onclick=()=>{soundOn=!soundOn;localStorage.setItem('tvSound',soundOn?'1':'0');updateSound();if(soundOn){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Som ativado');u.lang='pt-BR';speechSynthesis.speak(u)}};document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
function speak(c){if(!soundOn||!c)return;speechSynthesis.cancel();const code=c.code.replace(/([A-Z])/g,'$1 ').replace(/(\d)/g,'$1 ');const person=c.patientName?`${c.patientName}. `:'';const u=new SpeechSynthesisUtterance(`${person}Senha ${code}. Dirija-se a ${c.desk}.`);u.lang='pt-BR';u.rate=.88;u.pitch=1;speechSynthesis.speak(u)}
function render(s){const now=document.getElementById('now');if(s.current){now.innerHTML=`<div class="label">Senha chamada</div><div class="code">${s.current.code}</div>${s.current.patientName?`<div class="patient">${s.current.patientName}</div>`:''}<div class="desk">${s.current.desk}</div><div class="service">${s.current.serviceName}</div>`;if(s.current.callId&&s.current.callId!==lastId){lastId=s.current.callId;speak(s.current)}}else now.innerHTML='<div class="tv-empty">Aguardando chamada</div><div class="tv-empty-sub">A próxima senha aparecerá aqui.</div>';
document.getElementById('last').innerHTML=s.lastCalls.length?s.lastCalls.map(c=>`<div class="last-item"><strong>${c.code}</strong><span>${c.patientName?`${c.patientName}<br>`:''}${c.desk}<br><small>${formatTime(c.calledAt)}</small></span></div>`).join(''):'<div style="color:#cfeafb">Nenhuma chamada ainda.</div>';
document.getElementById('ticker').innerHTML='<strong>Em espera</strong>'+s.services.map(x=>`<span>${x.name}: <b>${x.waiting}</b></span>`).join('')}
async function poll(){try{render(await getState())}catch(e){console.error(e)}finally{setTimeout(poll,1200)}}poll();setInterval(()=>{const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})},1000);
</script></body></html>
